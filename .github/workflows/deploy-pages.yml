# Workflow de déploiement de la SPA sur GitHub Pages.
#
# Depuis v1.0.0 (S5), le déploiement principal de Pages est piloté par le
# workflow `release.yml` (job `deploy-pages`) déclenché sur push de tag `v*`.
# Ce workflow-ci reste en `workflow_dispatch` uniquement, comme filet de
# secours pour les rebuilds manuels d'urgence (correction de configuration
# Pages, redéploiement après incident, etc.).

name: Deploy to GitHub Pages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static SPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Activer Corepack (provisionne pnpm via packageManager)
        run: corepack enable

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production (base href ./)
        # `--base-href ./` : chemins relatifs, fonctionne identiquement sur
        # `https://rezdevops.github.io/pii-scanner-web/` et derrière un
        # reverse-proxy avec sous-chemin. Cohérent release.yml.
        run: |
          pnpm -r --filter='./packages/*' build
          pnpm --filter pii-scanner-web build:rel
        env:
          NODE_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/pii-scanner-web/dist/browser

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
