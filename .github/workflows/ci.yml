name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissions minimales par défaut. Les jobs de release demanderont
# explicitement les leurs (id-token, packages, pages...) sans hériter ici.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Matrix ["22", "24"] depuis le 2026-07-05 : Node 20 a atteint son EOL
      # (avril 2026, runtime setup-node retiré côté GitHub le 2026-06-02),
      # plus de couverture amont. Node 22 = LTS active (cible de build/deploy
      # Pages, cf. release.yml + deploy-pages.yml), Node 24 valide la
      # prochaine LTS. Cohérent avec rezdevops-site.
      matrix:
        node: ["22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Activer Corepack (provisionne pnpm via packageManager)
        run: corepack enable

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      # Build avant lint : le lint des packages = `tsc --noEmit`, et
      # `pii-scanner-engine` importe `@rezdevops/pii-detectors`. Sans build
      # préalable, le dist/ du package frère n'existe pas et tsc échoue
      # sur le résolveur de types (cf. ADR future si on bascule en
      # TypeScript Project References pour s'affranchir de cet ordre).
      - name: Build (lib + engine + app)
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      # Casse la build sur toute nouvelle CVE de niveau `high` ou `critical`
      # dans la chaîne de dépendances `production` (`--prod` exclut les
      # devDependencies, qui peuvent contenir des CVE moderate non
      # exploitables en runtime utilisateur — cf.
      # `docs/audit-dependances-v1.0.0.md`).
      #
      # Activé en S5 (planifié S4.1). Si un correctif n'existe pas encore
      # côté upstream, le déblocage doit passer par un override
      # `pnpm.overrides` documenté + une note dans l'audit, pas par la
      # suppression de ce step.
      - name: Audit dependencies (high+ severity threshold)
        run: node scripts/audit-deps.mjs
