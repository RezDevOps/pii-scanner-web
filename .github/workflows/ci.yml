name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissions minimales par défaut. Les jobs de release demanderont
# explicitement les leurs (id-token, packages, pages...) sans hériter ici.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      # Build avant lint : le lint des packages = `tsc --noEmit`, et
      # `pii-scanner-engine` importe `@rezdevops/pii-detectors`. Sans build
      # préalable, le dist/ du package frère n'existe pas et tsc échoue
      # sur le résolveur de types (cf. ADR future si on bascule en
      # TypeScript Project References pour s'affranchir de cet ordre).
      - name: Build (lib + engine + app)
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test
