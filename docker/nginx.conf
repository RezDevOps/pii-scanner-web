# Configuration nginx pour l'image pii-scanner-web.
#
# Le SPA Angular est servi en statique. La page « Comment vérifier » est un
# sous-dossier statique (`/verifier/`) qui doit échapper au fallback SPA.
#
# Headers de sécurité : CSP stricte alignée sur le <meta> du index.html
# (cohérent avec les directives serveur), + HSTS + X-Frame-Options +
# X-Content-Type-Options + Referrer-Policy + Permissions-Policy. Doublonnage
# meta + header HTTP : voulu (la CSP via header HTTP a précédence sur le meta
# pour les directives qu'elle déclare ; le meta couvre les contextes file://
# et derrière un reverse-proxy qui ne propagerait pas les headers).
#
# Cache :
# - index.html : `no-cache` strict (revalidate à chaque requête, sinon les
#   anciens utilisateurs gardent un index.html périmé qui pointe sur des
#   chunks JS qui n'existent plus après une release).
# - assets hashés (*.js, *.css, etc.) : `immutable, max-age=31536000`
#   (les noms incluent un hash de contenu, jamais réutilisés).

server {
    # Le port 8080 est imposé par l'image nginx-unprivileged (UID 101 ne peut
    # pas binder < 1024 sans CAP_NET_BIND_SERVICE). Configurable via
    # `NGINX_LISTEN` à l'exécution si nécessaire (cf. doc nginx-unprivileged).
    listen       8080 default_server;
    listen       [::]:8080 default_server;
    server_name  _;

    root         /usr/share/nginx/html;
    index        index.html;

    # ----- Compression (transport, pas storage) ----- #
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/wasm
        application/xml
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/html
        text/plain
        text/xml;

    # ----- Headers de sécurité globaux ----- #
    # CSP doublonnée avec la meta du index.html. Si la CSP des metas suffit,
    # on pourrait l'omettre ici, mais l'avoir en header protège aussi
    # /verifier/ et toute autre page statique servie hors SPA.
    add_header Content-Security-Policy
        "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'none'; object-src 'none'; media-src 'none'; manifest-src 'none'; frame-src 'none'; child-src 'self' blob:; frame-ancestors 'none'; form-action 'none'; base-uri 'none'"
        always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Coupe l'accès aux APIs intrusives navigateur. Permissive sur ce qu'on
    # utilise (rien) — explicite est plus sûr que par défaut.
    add_header Permissions-Policy
        "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
        always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # ----- Cache assets immuables ----- #
    location ~* \.(js|css|woff2?|ttf|eot|otf|svg|ico|png|jpg|jpeg|gif|webp|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
        try_files $uri =404;
    }

    # ----- Page « Comment vérifier » : statique, pas de fallback SPA ----- #
    location ^~ /verifier/ {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "public, max-age=300" always;
    }

    # ----- index.html : revalidate systématique ----- #
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # ----- SPA fallback (Angular routing) ----- #
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----- Pas d'access log (souveraineté + posture privacy) ----- #
    # Si un opérateur veut un log d'usage local pour debug, il modifie ce
    # fichier ; par défaut, aucun log identifiant n'est généré.
    access_log off;
    error_log /dev/stderr warn;

    # ----- Désactive les méthodes inutiles ----- #
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }
}
