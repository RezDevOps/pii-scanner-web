<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>pii-scanner-web — scanner local de données personnelles</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Content Security Policy stricte — promesse souveraineté du projet.
      Politique resserrée en v0.4.1 (S4.1 « durcissement plate-forme ») :
      - `default-src 'none'` : verrou principal, force chaque directive à
        être déclarée explicitement plutôt que d'hériter d'un défaut large.
      - `connect-src 'none'` : interdit toute requête réseau au runtime
        (fetch, XMLHttpRequest, WebSocket, EventSource, beacon, fetch-event).
      - `script-src 'self' 'wasm-unsafe-eval'` : scripts servis par
        l'origine du SPA + autorisation WebAssembly (PDF.js l'utilise pour
        ses optimisations). Cf. ADR 0006 + 0007.
      - `style-src 'self' 'unsafe-inline'` : Angular Material injecte des
        styles inline sur les composants (mat-ripple, mat-overlay). Le
        compromis est documenté ; pas d'autres vecteurs (pas de scripts inline).
      - `img-src 'self' data:` : Angular Material peut produire des data:
        URI pour des décorations légères (ripple, overlay). Aucune image
        externe n'est chargée.
      - `font-src 'self' data:` : conservée par anticipation. Aucune
        police n'est packagée à ce jour — la stack système est utilisée
        partout (cf. `src/styles.scss`). Les icônes Material sont rendues
        depuis des SVG inline TypeScript (cf. `src/app/icons/icon-registry.ts`),
        donc ni Material Icons font, ni Google Fonts, ni requête réseau.
      - `worker-src 'self' blob:` : Web Worker du pool de scan
        (bundler Angular peut servir le worker via un blob: URL).
      - `object-src 'none'` + `media-src 'none'` + `manifest-src 'none'`
        + `frame-src 'none'` : on n'embarque ni iframe, ni audio/vidéo,
        ni manifest PWA, ni objet plug-in.
      - `base-uri 'none'` + `form-action 'none'` : l'app n'a pas de <base>
        modifié runtime ni de <form action>.

      Note `frame-ancestors` : la directive est volontairement absente du
      <meta>. Par spec WHATWG, `frame-ancestors` n'est honorée que servie
      via header HTTP (la version <meta> est silencieusement ignorée et
      génère un warning console). La protection effective est donnée par :
      - `docker/nginx.conf` (image GHCR, header `Content-Security-Policy`
        complet incluant `frame-ancestors 'none'`),
      - `X-Frame-Options: DENY` posé en header dans la même conf nginx
        (compatible navigateurs anciens, équivalent fonctionnel).
      Côté GitHub Pages, GitHub n'autorise pas de headers HTTP custom :
      l'anti-clickjacking n'est pas garanti sur la démo GH Pages, c'est un
      compromis assumé pour v1.0 (le risque réel est faible : la SPA ne
      manipule aucune donnée serveur). Documenté dans `docs/comment-verifier-souverainete.md`.

      Toute exception future est une décision documentée (cadrage § 12).
      Cf. `docs/comment-verifier-souverainete.md` (étape DevTools dédiée).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'none'; object-src 'none'; media-src 'none'; manifest-src 'none'; frame-src 'none'; child-src 'self' blob:; form-action 'none'; base-uri 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="index,follow" />
    <meta
      name="description"
      content="Scanner local de données personnelles dans des fichiers bureautiques. Aucun upload : tout reste dans votre navigateur."
    />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <psw-root>Chargement de l'application…</psw-root>
  </body>
</html>
